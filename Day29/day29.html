function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function WarRoomScreen({ crisis, metrics, onComplete }) {
  const [selected, setSelected] = React.useState([]);
  const [resolved, setResolved] = React.useState(false);
  const [newMetrics, setNewMetrics] = React.useState(null);

  const toggle = (id) => {
    if (selected.includes(id)) setSelected(selected.filter(s => s !== id));
    else if (selected.length < 3) setSelected([...selected, id]);
  };

  const applyActions = () => {
    const updated = { ...metrics };
    selected.forEach(id => {
      const action = WAR_ROOM_ACTIONS.find(a => a.id === id);
      if (action) {
        updated.cost = clamp(updated.cost + action.effects.cost, 0, 100);
        updated.inventory = clamp(updated.inventory + action.effects.inventory, 0, 100);
        updated.delivery = clamp(updated.delivery + action.effects.delivery, 0, 100);
        updated.satisfaction = clamp(updated.satisfaction + action.effects.satisfaction, 0, 100);
      }
    });
    setNewMetrics(updated);
    setResolved(true);
  };

  return (
    <div className="fade-in" style={{ maxWidth:800, margin:'0 auto', padding:'32px 20px' }}>
      <div style={{ textAlign:'center', marginBottom:24 }}>
        <div style={{ fontSize:11, color:'#ef4444', letterSpacing:3, fontWeight:700, marginBottom:8 }}>PHASE 2 OF 4</div>
        <h2 style={{ fontSize:26, fontWeight:800 }}>âï¸ War Room</h2>
        <p style={{ color:'#94a3b8', fontSize:14, marginTop:8 }}>
          Crisis: <strong style={{color:'#f59e0b'}}>{crisis.type}</strong> Â· Choose exactly 3 response actions. Your choices will directly impact all key metrics.
        </p>
      </div>

      {!resolved ? (
        <>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:12, marginBottom:24 }}>
            {WAR_ROOM_ACTIONS.map(action => {
              const isSelected = selected.includes(action.id);
              const isDisabled = !isSelected && selected.length >= 3;
              return (
                <div key={action.id} className="card" onClick={() => !isDisabled && toggle(action.id)}
                  style={{ cursor: isDisabled ? 'not-allowed' : 'pointer', opacity: isDisabled ? 0.4 : 1,
                    border: isSelected ? '2px solid #3b82f6' : '1px solid #334155',
                    background: isSelected ? '#1e3a5f' : '#1e293b', transition:'all 0.2s' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8 }}>
                    <span style={{fontSize:24}}>{action.emoji}</span>
                    <span style={{ fontWeight:700, fontSize:15 }}>{action.label}</span>
                    {isSelected && <span style={{ marginLeft:'auto', color:'#3b82f6', fontWeight:800 }}>â</span>}
                  </div>
                  <p style={{ color:'#94a3b8', fontSize:13, lineHeight:1.5, marginBottom:10 }}>{action.description}</p>
                  <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                    {Object.entries(action.effects).map(([k,v]) => (
                      <span key={k} style={{ fontSize:11, padding:'2px 8px', borderRadius:20,
                        background: v > 0 ? '#14532d' : '#450a0a', color: v > 0 ? '#4ade80' : '#f87171',
                        fontWeight:600 }}>{k}: {v > 0 ? '+' : ''}{v}</span>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{ textAlign:'center' }}>
            <div style={{ color:'#64748b', fontSize:14, marginBottom:12 }}>Selected: {selected.length}/3 actions</div>
            <button className="btn" onClick={applyActions} disabled={selected.length !== 3}
              style={{ background: selected.length === 3 ? 'linear-gradient(135deg,#10b981,#3b82f6)' : '#1e293b',
                color: selected.length === 3 ? 'white' : '#475569',
                padding:'14px 40px', borderRadius:12, fontSize:15, fontWeight:700,
                cursor: selected.length === 3 ? 'pointer' : 'not-allowed', border: selected.length !== 3 ? '1px solid #334155' : 'none' }}>

            </button>
          </div>
        </>

            <h3 style={{ fontWeight:700, marginBottom:16, fontSize:18 }}>ð Impact Analysis â After Your Actions</h3>

              {[
                { key:'cost', label:'Cost Control', color:'#3b82f6', icon:'ð°' },
                { key:'inventory', label:'Inventory Level', color:'#10b981', icon:'ð¦' },
                { key:'delivery', label:'Delivery Speed', color:'#f59e0b', icon:'ð' },
                { key:'satisfaction', label:'Customer Satisfaction', color:'#8b5cf6', icon:'â­' },
              ].map(m => (
                <div key={m.key}>
                  <div style={{ display:'flex', justifyContent:'space-between', marginBottom:4 }}>

          </div>
          <div style={{ textAlign:'center' }}>
            <button className="btn" onClick={() => onComplete(newMetrics)} style={{ background:'linear-gradient(135deg,#6366f1,#8b5cf6)', color:'white', padding:'14px 40px', borderRadius:12, fontSize:15, fontWeight:700 }}>
              Proceed to Supplier Negotiation â
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function NegotiationScreen({ onComplete }) {
  const [round, setRound] = React.useState(0);
  const [trust, setTrust] = React.useState(50);
  const [price, setPrice] = React.useState(100);
  const [lead, setLead] = React.useState(30);
  const [history, setHistory] = React.useState([]);
  const [done, setDone] = React.useState(false);

  const choose = (choice) => {
    const newTrust = clamp(trust + choice.trustEffect, 0, 100);
    const newPrice = clamp(price + choice.priceEffect, 60, 150);
    const newLead = clamp(lead + choice.leadEffect, 15, 60);
    const h = [...history, { round:round+1, choice:choice.label, trustEffect:choice.trustEffect, priceEffect:choice.priceEffect, leadEffect:choice.leadEffect }];
    setTrust(newTrust); setPrice(newPrice); setLead(newLead); setHistory(h);
    if (round >= NEGOTIATION_SCENARIOS.length - 1) setDone(true);
    else setRound(round + 1);
  };

  const negotiationScore = Math.round((trust * 0.5) + ((150 - price) / 90 * 30) + ((60 - lead) / 45 * 20));

  if (done) {
    return (
      <div className="fade-in" style={{ maxWidth:700, margin:'0 auto', padding:'32px 20px' }}>
        <div style={{ textAlign:'center', marginBottom:28 }}>
          <div style={{ fontSize:11, color:'#6366f1', letterSpacing:3, fontWeight:700, marginBottom:8 }}>NEGOTIATION COMPLETE</div>
          <h2 style={{ fontSize:26, fontWeight:800 }}>ð¤ Supplier Deal Closed</h2>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12, marginBottom:24 }}>
          <ScoreCard title="Trust Level" value={trust + '%'} color={trust >= 70 ? '#10b981' : trust >= 40 ? '#f59e0b' : '#ef4444'} />
          <ScoreCard title="Final Price Index" value={price + '%'} subtitle="100% = original price" color={price <= 100 ? '#10b981' : price <= 120 ? '#f59e0b' : '#ef4444'} />
          <ScoreCard title="Lead Time" value={lead + ' days'} color={lead <= 25 ? '#10b981' : lead <= 40 ? '#f59e0b' : '#ef4444'} />
        </div>
        <div className="card" style={{ marginBottom:20 }}>
          <div style={{ fontWeight:700, marginBottom:12 }}>Negotiation Score: <span style={{ color:'#6366f1', fontSize:22 }}>{negotiationScore}/100</span></div>
          <div style={{ display:'grid', gap:6 }}>
            {history.map(h => (
              <div key={h.round} style={{ fontSize:13, color:'#94a3b8', display:'flex', gap:8 }}>
                <span style={{color:'#64748b'}}>Round {h.round}:</span>
                <span style={{color:'#e2e8f0'}}>{h.choice}</span>
                <span style={{marginLeft:'auto', color: h.trustEffect >= 0 ? '#10b981' : '#ef4444' }}>Trust {h.trustEffect >= 0 ? '+' : ''}{h.trustEffect}</span>
              </div>
            ))}
          </div>
        </div>
        <div style={{ textAlign:'center' }}>
          <button className="btn" onClick={() => onComplete(negotiationScore, { trust, price, lead })} style={{ background:'linear-gradient(135deg,#f59e0b,#ef4444)', color:'white', padding:'14px 40px', borderRadius:12, fontSize:15, fontWeight:700 }}>
            Enter CEO Boardroom â
          </button>
        </div>
      </div>
    );
  }

  const scenario = NEGOTIATION_SCENARIOS[round];
  return (
    <div className="fade-in" style={{ maxWidth:700, margin:'0 auto', padding:'32px 20px' }}>
      <div style={{ textAlign:'center', marginBottom:24 }}>
        <div style={{ fontSize:11, color:'#6366f1', letterSpacing:3, fontWeight:700, marginBottom:8 }}>PHASE 3 OF 4 Â· ROUND {round+1}/4</div>
        <h2 style={{ fontSize:26, fontWeight:800 }}>ð¤ Supplier Negotiation</h2>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10, marginBottom:20 }}>
        <div className="card" style={{ textAlign:'center' }}>
          <div style={{ fontSize:11, color:'#64748b' }}>Trust</div>
          <div style={{ fontWeight:800, fontSize:20, color: trust >= 60 ? '#10b981' : '#f59e0b' }}>{trust}%</div>
        </div>
        <div className="card" style={{ textAlign:'center' }}>
          <div style={{ fontSize:11, color:'#64748b' }}>Price Index</div>
          <div style={{ fontWeight:800, fontSize:20, color: price <= 100 ? '#10b981' : '#ef4444' }}>{price}%</div>
        </div>
        <div className="card" style={{ textAlign:'center' }}>
          <div style={{ fontSize:11, color:'#64748b' }}>Lead Time</div>
          <div style={{ fontWeight:800, fontSize:20, color: lead <= 25 ? '#10b981' : '#f59e0b' }}>{lead}d</div>
        </div>
      </div>

      <div className="card" style={{ marginBottom:20, borderColor:'#6366f1' }}>
        <div style={{ fontSize:11, color:'#6366f1', fontWeight:700, marginBottom:8 }}>ROUND {round+1} SITUATION</div>
        <p style={{ color:'#cbd5e1', lineHeight:1.7, fontSize:15 }}>{scenario.situation}</p>
      </div>

      <div style={{ display:'grid', gap:10 }}>
        {scenario.choices.map((choice, i) => (
          <button key={i} className="btn card" onClick={() => choose(choice)}
            style={{ textAlign:'left', cursor:'pointer', border:'1px solid #334155' }}>
            <div style={{ display:'flex', gap:12, alignItems:'center' }}>
              <div style={{ width:28, height:28, borderRadius:8, background:'#0f172a', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:700, color:'#6366f1', fontSize:13, flexShrink:0 }}>{i+1}</div>
              <span style={{ fontSize:14, color:'#e2e8f0' }}>{choice.text}</span>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

function BoardroomScreen({ onComplete }) {
  const [q, setQ] = React.useState(0);
  const [answers, setAnswers] = React.useState([]);
  const [selected, setSelected] = React.useState(null);
  const [revealed, setRevealed] = React.useState(false);

  const answer = (idx) => {
    setSelected(idx);
    setRevealed(true);
  };

  const next = () => {
    const newAnswers = [...answers, { q:q, selected, correct:CEO_QUESTIONS[q].correct, isCorrect:selected === CEO_QUESTIONS[q].correct }];
    setAnswers(newAnswers);
    if (q >= CEO_QUESTIONS.length - 1) {
      onComplete(newAnswers);
    } else {
      setQ(q + 1);
      setSelected(null);
      setRevealed(false);
    }
  };

  const question = CEO_QUESTIONS[q];
  const score = Math.round(((q) / CEO_QUESTIONS.length) * 100);

  return (
    <div className="fade-in" style={{ maxWidth:700, margin:'0 auto', padding:'32px 20px' }}>
      <div style={{ textAlign:'center', marginBottom:24 }}>
        <div style={{ fontSize:11, color:'#f59e0b', letterSpacing:3, fontWeight:700, marginBottom:8 }}>PHASE 4 OF 4 Â· QUESTION {q+1}/{CEO_QUESTIONS.length}</div>
        <h2 style={{ fontSize:26, fontWeight:800 }}>ð CEO Boardroom</h2>
        <p style={{ color:'#94a3b8', fontSize:14, marginTop:6 }}>Executive decision-making under pressure</p>
      </div>

      <div style={{ background:'#1e293b', borderRadius:8, height:6, marginBottom:24, overflow:'hidden' }}>
        <div style={{ height:'100%', background:'linear-gradient(90deg,#f59e0b,#ef4444)', width:`${(q/CEO_QUESTIONS.length)*100}%`, transition:'width 0.4s' }} />
      </div>

      <div className="card" style={{ marginBottom:16, borderColor:'#f59e0b' }}>
        <div style={{ fontSize:11, color:'#f59e0b', fontWeight:700, marginBottom:10 }}>BOARD QUESTION {q+1}</div>
        <p style={{ color:'#e2e8f0', fontSize:16, lineHeight:1.7, fontWeight:500 }}>{question.q}</p>
      </div>

      <div style={{ display:'grid', gap:10, marginBottom:20 }}>
        {question.choices.map((choice, i) => {
          let bg = '#1e293b'; let border = '#334155'; let color = '#e2e8f0';
          if (revealed) {
            if (i === question.correct) { bg = '#14532d'; border = '#16a34a'; color = '#4ade80'; }
            else if (i === selected) { bg = '#450a0a'; border = '#dc2626'; color = '#f87171'; }
            else { color = '#64748b'; }
          }
          return (
            <button key={i} className="btn" onClick={() => !revealed && answer(i)}
              style={{ textAlign:'left', padding:14, borderRadius:12, border:`1px solid ${border}`, background:bg, color, fontSize:14, cursor: revealed ? 'default' : 'pointer' }}>
              <span style={{ fontWeight:700, marginRight:10 }}>{['A','B','C','D'][i]}.</span>{choice}
            </button>
          );
        })}
      </div>

      {revealed && (
        <div className="fade-in card" style={{ background: selected === question.correct ? '#052e16' : '#1c0a0a', borderColor: selected === question.correct ? '#16a34a' : '#dc2626', marginBottom:16 }}>
          <div style={{ fontWeight:700, color: selected === question.correct ? '#4ade80' : '#f87171', marginBottom:6 }}>
            {selected === question.correct ? 'â Correct!' : 'â Not optimal'}
          </div>
          <p style={{ fontSize:14, color:'#cbd5e1', lineHeight:1.6 }}>{question.explanation}</p>
        </div>
      )}

      {revealed && (
        <div style={{ textAlign:'center' }}>
          <button className="btn" onClick={next} style={{ background:'linear-gradient(135deg,#f59e0b,#ef4444)', color:'white', padding:'12px 36px', borderRadius:12, fontSize:14, fontWeight:700 }}>
            {q < CEO_QUESTIONS.length - 1 ? 'Next Question â' : 'View Final Results â'}
          </button>
        </div>
      )}
    </div>
  );
}

function ResultsScreen({ company, crisis, warMetrics, negScore, negDetails, boardAnswers, onRestart }) {
  const boardScore = Math.round((boardAnswers.filter(a => a.isCorrect).length / boardAnswers.length) * 100);
  const finalScore = Math.round((
    (warMetrics.cost + warMetrics.inventory + warMetrics.delivery + warMetrics.satisfaction) / 4 * 0.4 +
    negScore * 0.3 +
    boardScore * 0.3
  ));

  const grade = finalScore >= 85 ? { label:'S â Crisis Master', color:'#f59e0b', emoji:'ð' }
    : finalScore >= 70 ? { label:'A â Strategic Leader', color:'#10b981', emoji:'â­' }
    : finalScore >= 55 ? { label:'B â Capable Manager', color:'#3b82f6', emoji:'ð' }
    : { label:'C â Learning Opportunity', color:'#94a3b8', emoji:'ð' };

  return (
    <div className="fade-in" style={{ maxWidth:800, margin:'0 auto', padding:'32px 20px' }}>
      <div style={{ textAlign:'center', marginBottom:32 }}>
        <div style={{ fontSize:56 }}>{grade.emoji}</div>
        <div style={{ fontSize:48, fontWeight:900, color:grade.color, margin:'8px 0' }}>{finalScore}</div>
        <div style={{ fontSize:22, fontWeight:700 }}>{grade.label}</div>
        <div style={{ color:'#64748b', fontSize:14, marginTop:8 }}>
          {company.companyName} vs. {crisis.type}
        </div>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12, marginBottom:28 }}>
        <ScoreCard title="War Room Score" value={Math.round((warMetrics.cost+warMetrics.inventory+warMetrics.delivery+warMetrics.satisfaction)/4)+'%'} subtitle="avg of 4 metrics" color="#ef4444" />
        <ScoreCard title="Negotiation Score" value={negScore+'/100'} subtitle={`Trust: ${negDetails.trust}% Â· Lead: ${negDetails.lead}d`} color="#6366f1" />
        <ScoreCard title="Boardroom Score" value={boardScore+'%'} subtitle={`${boardAnswers.filter(a=>a.isCorrect).length}/${boardAnswers.length} correct`} color="#f59e0b" />
      </div>

      <div className="card" style={{ marginBottom:20 }}>
        <h3 style={{ fontWeight:700, marginBottom:12 }}>ð Post-Crisis Metrics</h3>
        <div style={{ display:'grid', gap:10 }}>
          {[
            { key:'cost', label:'Cost Control', color:'#3b82f6', icon:'ð°' },
            { key:'inventory', label:'Inventory Level', color:'#10b981', icon:'ð¦' },
            { key:'delivery', label:'Delivery Speed', color:'#f59e0b', icon:'ð' },
            { key:'satisfaction', label:'Customer Satisfaction', color:'#8b5cf6', icon:'â­' },
          ].map(m => <MetricBar key={m.key} label={m.label} value={warMetrics[m.key]} color={m.color} icon={m.icon} />)}
        </div>
      </div>

      <div className="card" style={{ marginBottom:24 }}>
        <h3 style={{ fontWeight:700, marginBottom:12 }}>ð Boardroom Review</h3>
        {boardAnswers.map((a, i) => (
          <div key={i} style={{ display:'flex', gap:10, alignItems:'center', padding:'8px 0', borderBottom:'1px solid #1e293b' }}>
            <span style={{ fontSize:18 }}>{a.isCorrect ? 'â' : 'â'}</span>
            <span style={{ fontSize:13, color:'#94a3b8' }}>Q{i+1}: {CEO_QUESTIONS[i].q.substring(0,60)}...</span>
          </div>
        ))}
      </div>

      <div style={{ textAlign:'center' }}>
        <button className="btn" onClick={onRestart} style={{ background:'linear-gradient(135deg,#3b82f6,#6366f1)', color:'white', padding:'16px 48px', borderRadius:12, fontSize:16, fontWeight:700 }}>
          âº Play Again (New Company & Crisis)
        </button>
      </div>
    </div>
  );
}

// âââ APP âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ

function App() {
  const [screen, setScreen] = React.useState('welcome');
  const [company, setCompany] = React.useState(null);
  const [crisis, setCrisis] = React.useState(null);
  const [metrics, setMetrics] = React.useState({ cost:50, inventory:60, delivery:55, satisfaction:65 });
  const [negScore, setNegScore] = React.useState(0);
  const [negDetails, setNegDetails] = React.useState({});
  const [boardAnswers, setBoardAnswers] = React.useState([]);

  const startSim = () => {
    const c = generateCompany();
    const cr = rand(CRISES);
    setCompany(c);
    setCrisis(cr);
    // Randomize starting metrics
    setMetrics({ cost: randInt(35,55), inventory: randInt(40,65), delivery: randInt(30,55), satisfaction: randInt(50,70) });
    setScreen('company');
  };

  const restart = () => {
    setScreen('welcome');
    setCompany(null); setCrisis(null); setNegScore(0); setNegDetails({}); setBoardAnswers([]);
    setMetrics({ cost:50, inventory:60, delivery:55, satisfaction:65 });
  };

  return (
    <div style={{ minHeight:'100vh' }}>
      {/* Header */}
      <div style={{ background:'linear-gradient(135deg,#0f172a,#1e1b4b)', borderBottom:'1px solid #1e293b', padding:'12px 20px' }}>
        <div style={{ maxWidth:800, margin:'0 auto', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div>
            <div style={{ fontSize:11, color:'#6366f1', fontWeight:700, letterSpacing:2 }}>60 DAYS OF AI Â· DAY 29</div>
            <div style={{ fontWeight:800, fontSize:16 }}>Operation Lifeline: Supply Chain Crisis Lab</div>
          </div>
          {screen !== 'welcome' && (
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <div style={{ display:'flex', gap:6 }}>
                {['company','warroom','negotiation','boardroom','results'].map((s,i) => (
                  <div key={s} style={{ width:24, height:4, borderRadius:2, background:
                    ['company','warroom','negotiation','boardroom','results'].indexOf(screen) >= i ? '#6366f1' : '#1e293b' }} />
                ))}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Screens */}
      {screen === 'welcome' && <WelcomeScreen onStart={startSim} />}
      {screen === 'company' && <CompanyScreen company={company} crisis={crisis} onContinue={() => setScreen('warroom')} />}
      {screen === 'warroom' && <WarRoomScreen crisis={crisis} metrics={metrics} onComplete={(m) => { setMetrics(m); setScreen('negotiation'); }} />}
      {screen === 'negotiation' && <NegotiationScreen onComplete={(score, details) => { setNegScore(score); setNegDetails(details); setScreen('boardroom'); }} />}
      {screen === 'boardroom' && <BoardroomScreen onComplete={(answers) => { setBoardAnswers(answers); setScreen('results'); }} />}
      {screen === 'results' && <ResultsScreen company={company} crisis={crisis} warMetrics={metrics} negScore={negScore} negDetails={negDetails} boardAnswers={boardAnswers} onRestart={restart} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
